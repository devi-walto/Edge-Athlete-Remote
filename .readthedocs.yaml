# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
#
# ⚠️ NOTHING IS BUILDING FROM THIS FILE RIGHT NOW, AND THAT IS EXPECTED.
# This repo is private, and Read the Docs Community (readthedocs.org, the free one)
# cannot clone a private repo — private repositories are a Read the Docs Business
# feature ($50/month at the time of writing, with a 30-day trial). Checked 2026-09-17.
#
# So the docs are built locally instead:
#
#   ./docs/build.sh     build the site once and print where it landed
#   ./docs/serve.sh     live preview that rebuilds as you type
#
# This file is kept, unchanged and correct, so that pointing a Business account (or a
# public docs mirror) at this repo is a one-click job rather than a rebuild of the
# toolchain. If you do connect one, the two versions described in
# docs/stack/sphinx.md come back with it.

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# Build documentation in the "docs/" directory with Sphinx.
# `fail_on_warning` stops a site with dead links from publishing — a broken
# cross-reference fails the build instead of shipping quietly.
sphinx:
   configuration: docs/conf.py
   fail_on_warning: true

# The packages the build needs. Without this, Read the Docs installs a bare
# Sphinx that cannot read Markdown, and every page fails. See docs/requirements.txt.
python:
   install:
   - requirements: docs/requirements.txt
