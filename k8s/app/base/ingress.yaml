# ingress.yaml — which requests go where, for one school's address.
#
# This is the same job nginx/nginx.conf does on a local install: look at the
# path of each request and send it to django or to react. Here the reverse proxy
# is Traefik (already running on the server, shared by every school), and this
# file is the routing it follows for this school.
#
# Two things nginx.conf does that are NOT repeated here, because in remote mode
# django does them itself (spec 05): the sign-in rate limit, and telling
# browsers never to keep a copy of sign-in replies.
#
# ${SCHOOL_HOST} is filled in by eactl for each school. Every school is public,
# over HTTPS. (A new school is protected by its one-time setup code until it's
# claimed; a school can be suspended, which switches it off, in spec 13.)

apiVersion: networking.k8s.io/v1
# Ingress: routing rules for the reverse proxy (the protection call in the
# football picture): "requests for this address and this path go to this Service."
kind: Ingress
metadata:
  name: school
  annotations:
    # Ask cert-manager for an HTTPS certificate from Let's Encrypt (see
    # k8s/cluster/letsencrypt-issuers.yaml). It's only issued once the address
    # leads to this server: its DNS record, and its line in the hairpin rules.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  # Which reverse proxy follows these rules: Traefik, the one k3s provides.
  ingressClassName: traefik
  # Serve this address over HTTPS, with the certificate cert-manager keeps (and
  # renews) in the Secret school-tls.
  tls:
    - hosts:
        - ${SCHOOL_HOST}
      secretName: school-tls
  rules:
    # Only requests addressed to this school's own name. Every school has its
    # own name, so one Traefik can serve many schools side by side.
    - host: ${SCHOOL_HOST}
      http:
        # Traefik picks the LONGEST matching path, so /api/... goes to django
        # even though "/" (react) would match everything. Same rules as
        # nginx.conf.
        paths:
          # The app's API: everything the screens ask the server for.
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: django
                port:
                  number: 8000
          # Django's own admin pages.
          - path: /admin/
            pathType: Prefix
            backend:
              service:
                name: django
                port:
                  number: 8000
          # The stylesheets and scripts those admin pages (and the API's
          # browsable pages) load. Django serves these itself.
          - path: /static/admin/
            pathType: Prefix
            backend:
              service:
                name: django
                port:
                  number: 8000
          - path: /static/rest_framework/
            pathType: Prefix
            backend:
              service:
                name: django
                port:
                  number: 8000
          # Live updates. Not a page and not part of the API: screens open one
          # lasting connection here, and Traefik passes it on to the broker's
          # screens door. Listen-only online (mosquitto-remote.conf).
          - path: /mqtt
            pathType: Prefix
            backend:
              service:
                name: mosquitto
                port:
                  name: screens
          # Everything else: the screens themselves.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: react
                port:
                  number: 80
