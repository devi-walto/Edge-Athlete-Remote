# private-only.yaml — keeps a school that's still being tested private.
#
# Traefik (the reverse proxy every visit passes through) checks each visitor's
# address against this list before passing the visit on. Only these get in:
#   - Tailscale devices: every one has an address in 100.64.0.0/10
#   - devices on the server's own home network: ${HOME_RANGE}, asked by
#     `eactl init` (it's personal, so it's never written in the repo)
# Anyone else gets "403 Forbidden".
#
# This only works because Traefik sees each visitor's real address
# (k8s/cluster/traefik-keep-visitor-address.yaml). It comes off when the school
# goes public (spec 12, Phase 4).

apiVersion: traefik.io/v1alpha1
# Middleware: a step Traefik runs on a request between receiving it and
# passing it to the app. The Ingress (ingress.yaml) switches it on for this
# school by name. This one is an IP allow list.
kind: Middleware
metadata:
  name: private-only
spec:
  ipAllowList:
    sourceRange:
      - 100.64.0.0/10
      - ${HOME_RANGE}
