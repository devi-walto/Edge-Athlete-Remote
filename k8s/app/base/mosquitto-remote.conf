# mosquitto-remote.conf — the message broker's settings on the remote server.
#
# Online, anyone on the internet can reach the screens door. Screens only listen
# there; they save everything through the website instead. So online that door is
# listen-only: anyone can listen, nobody can send.
#
# Sensors get a door of their own (spec 14): nobody gets in without a sensor login,
# and each sensor may send only its own messages.
#
# A local install keeps using mosquitto/mosquitto.conf, unchanged. Apart from the
# screens and sensors doors, both files say the same thing: change one, change both.
# (The names for the doors and the broker's user are listed in mosquitto.yaml.)

# Let each door below have its own rules.
per_listener_settings true

# The programs door (port 1883): django and the workers. Not reachable from outside.
listener 1883
allow_anonymous true

# The screens door (port 9001): browsers, through the school's /mqtt address.
# Listen-only, by the rules in browser.acl.
listener 9001
protocol websockets
allow_anonymous true
acl_file /mosquitto/config/browser.acl

# The sensors door (port 9002): sensors at home, through the school's /sensors
# address, encrypted by Traefik in front (wss on 443, like the screens). The logins
# are kept by the broker's "dynamic security" plugin in a file on its own disk:
#   - each sensor has its own login (its ID and its sensor token) and may send only
#     under edgeathlete/node/<its id>/;
#   - django is the administrator, and adds and removes sensor logins while the
#     broker runs (services/sensor_logins.py);
#   - nobody else gets in, not even to listen.
# The plugin works on this door only: commands sent on the programs door are
# ignored (checked against Mosquitto 2.0.22). The file is made by
# sensors-door-init.sh before the broker starts.
listener 9002
protocol websockets
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Same as a local install (reasons in mosquitto/mosquitto.conf).
persistence true
persistence_location /mosquitto/data/
persistent_client_expiration 1d
