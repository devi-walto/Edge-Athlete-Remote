# mosquitto-remote.conf — the message broker's settings on the remote server.
#
# Online, anyone on the internet can reach the door that screens use. Screens only
# listen there; they save everything through the website instead. So online that
# door is listen-only: anyone can listen, nobody can send.
#
# A local install keeps using mosquitto/mosquitto.conf, unchanged. Apart from the
# screens' door, both files say the same thing: change one, change both.

# Let each door below have its own rules.
per_listener_settings true

# Door 1883: the server's own programs. Not reachable from outside.
listener 1883
allow_anonymous true

# Door 9001: the screens, through the school's web address. Listen-only, by the
# rules in browser.acl.
listener 9001
protocol websockets
allow_anonymous true
acl_file /mosquitto/config/browser.acl

# Same as a local install (reasons in mosquitto/mosquitto.conf).
persistence true
persistence_location /mosquitto/data/
persistent_client_expiration 1d
