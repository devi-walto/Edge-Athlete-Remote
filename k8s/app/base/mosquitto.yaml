# mosquitto.yaml — one school's message broker (MQTT).
#
# Why a school needs one: sensors and screens don't talk to each other directly.
# A sensor sends each rep to the broker, and the broker passes it on to whoever
# is listening (the rack screen, django's listener). Every school gets its own
# broker, so one school's messages can never reach another school.
#
# Same broker as a local install. Its settings are mosquitto-remote.conf, the
# local settings with the screens door made listen-only.
#
# Names used in this file and its settings:
#   the broker            the program, Mosquitto
#   the broker's user     the Linux user the broker switches to after starting.
#                         It comes with the broker's image: user "mosquitto"
#                         (number 1883) in group "mosquitto" (number 1883).
#   the programs door     port 1883, the standard MQTT port: django and the
#                         workers. Not reachable from outside.
#   the screens door      port 9001: browsers, through the site's /mqtt address.
#                         Anyone may listen, nobody may send.
#   the sensors door      port 9002: sensors, through the site's /sensors address.
#                         Only with a sensor's own login; it sends only its own.
# The user's number and the programs door's number are both 1883 only because
# the image's makers chose them to match. They have nothing to do with each other.

apiVersion: v1
# PersistentVolumeClaim: a locker ticket. Why the broker needs a locker: when a
# rack screen blinks offline, the broker holds that screen's reps until it comes
# back. Keeping them on disk means a broker restart doesn't lose them either.
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi   # a label, not a limit (see k8s/db/postgres/storage.yaml)

---
apiVersion: apps/v1
# Deployment: a position group with a set count. Kubernetes keeps one broker
# running and starts a new one if it stops.
kind: Deployment
metadata:
  name: mosquitto
spec:
  # Exactly one. Two brokers would split the school's messages between them, so
  # a screen connected to one would miss reps sent to the other.
  replicas: 1
  # When updating, stop the old broker before starting the new one, so the two
  # never use the locker at the same time.
  strategy:
    type: Recreate
  # The jersey patch: which pods belong to this group.
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      # The broker starts as root, then switches to the broker's user before it
      # reads its rules file (browser.acl). So the files Kubernetes puts in this
      # pod are given to the broker's user's group, and defaultMode below lets
      # that group read them. Kubernetes only accepts the group's number here,
      # not its name.
      securityContext:
        fsGroup: 1883   # group "mosquitto", the broker's user's group (not the port)
        # Only change the locker's group if it's wrong, instead of on every start.
        fsGroupChangePolicy: OnRootMismatch
      # A step that must finish before the broker starts: make the sensors door's
      # login file the first time (sensors-door-init.sh explains it). Runs as the
      # broker's user, so the file belongs to the broker.
      initContainers:
        - name: sensors-door
          image: eclipse-mosquitto:2.0.22
          command: ["sh", "/mosquitto/config/sensors-door-init.sh"]
          securityContext:
            runAsUser: 1883    # the broker's user
            runAsGroup: 1883
          env:
            # The administrator password django uses on the sensors door. From the
            # school's broker-admin secret (made by eactl). optional: a school that
            # doesn't have it yet still starts, with its sensors door locked.
            - name: SENSORS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: broker-admin
                  key: password
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/sensors-door-init.sh
              subPath: sensors-door-init.sh
            - name: data
              mountPath: /mosquitto/data
      containers:
        - name: mosquitto
          # Pinned, so a rebuild months from now gets exactly this broker.
          image: eclipse-mosquitto:2.0.22
          ports:
            # The programs door: plain MQTT, for django and the workers (and,
            # on a local install, the sensors).
            - name: programs
              containerPort: 1883
            # The screens door: MQTT wrapped in WebSockets, for browsers. A web
            # page isn't allowed to use plain MQTT, only web-style connections.
            # Online, Traefik adds the encryption (wss) in front of this.
            - name: screens
              containerPort: 9001
            # The sensors door: MQTT in WebSockets too, with a login per sensor.
            # Online, Traefik adds the encryption (wss) in front of this.
            - name: sensors
              containerPort: 9002
          volumeMounts:
            # The settings file, placed exactly where the broker looks for it.
            # subPath puts in just that one file and leaves the rest of the
            # folder as the image ships it.
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            # The rules for the screens door (listen-only), next to it.
            - name: config
              mountPath: /mosquitto/config/browser.acl
              subPath: browser.acl
            # The locker, where mosquitto.conf says to keep held messages, and
            # where the sensors door keeps its logins.
            - name: data
              mountPath: /mosquitto/data
          # "Ready?" Is the programs door accepting connections yet? Until it
          # is, nothing is sent its way.
          readinessProbe:
            tcpSocket:
              port: programs
            periodSeconds: 5
          # "Still alive?" The same question, asked less often. Three misses in
          # a row and it's restarted.
          livenessProbe:
            tcpSocket:
              port: programs
            initialDelaySeconds: 10
            periodSeconds: 20
          # A broker for one gym's racks needs very little. The limit stops a
          # runaway from taking memory the rest of the server needs.
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: mosquitto-config   # made by kustomization.yaml
            # Readable by root and the broker's user's group, nobody else.
            #   0400 (root only): the broker can't open its rules file and stops.
            #     This is what broke v0.5.0.
            #   0444 (everyone): works, but the broker warns future versions
            #     will refuse it.
            # Checked against Mosquitto 2.0.22 with real file permissions (a
            # Docker volume, not a Mac shared folder, which ignores them).
            defaultMode: 0440
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto-data

---
apiVersion: v1
# Service: a position name. Inside this school, "mosquitto" always reaches the
# broker, whatever its pod's address is today. It's the same name the app uses
# on a local install (MQTT_HOST=mosquitto), so the app needs no changes.
kind: Service
metadata:
  name: mosquitto
spec:
  # Inside the server only. Browsers reach the screens door through the site's
  # /mqtt address and sensors the sensors door through /sensors (ingress.yaml).
  # Django reaches the sensors door here too, to add and remove sensor logins.
  type: ClusterIP
  selector:
    app: mosquitto
  ports:
    - name: programs
      port: 1883
      targetPort: programs
    - name: screens
      port: 9001
      targetPort: screens
    - name: sensors
      port: 9002
      targetPort: sensors
