# components/private — for a school still in testing: only Tailscale devices
# can open it. eactl adds this to the base when a school's namespace says
# ea/access=private (every new school starts this way).

# Component: an optional extra for a Kustomization. It adds files and changes
# to whatever it's added to, the way a game-day package adds to the playbook.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# The guard itself.
resources:
  - private-only.yaml

# Switch the guard on for the school's routes.
patches:
  - path: ingress-guard.yaml
