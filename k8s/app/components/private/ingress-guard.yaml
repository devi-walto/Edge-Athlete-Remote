# ingress-guard.yaml — a patch: only the lines this component adds to the
# school's Ingress (../../base/ingress.yaml). Kustomize finds the Ingress by its
# kind and name, and merges these lines into it.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: school
  annotations:
    # Run every request through the guard (private-only.yaml) first.
    # Traefik names it <namespace>-<name>@kubernetescrd: "the Middleware object
    # called private-only, in this school's namespace." eactl fills in the
    # namespace.
    traefik.ingress.kubernetes.io/router.middlewares: ${NAMESPACE}-private-only@kubernetescrd
