# ingress-tls.yaml — a patch: only the lines this component adds to the
# school's Ingress (../../base/ingress.yaml).

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: school
  annotations:
    # Ask cert-manager for a certificate from Let's Encrypt (the real one; see
    # k8s/cluster/letsencrypt-issuers.yaml).
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  # Serve this address over HTTPS, with the certificate cert-manager keeps in
  # the Secret school-tls (it makes and renews it).
  tls:
    - hosts:
        - ${SCHOOL_HOST}
      secretName: school-tls
