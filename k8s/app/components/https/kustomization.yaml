# components/https — for a public school: an HTTPS certificate for its address,
# from Let's Encrypt, renewed by cert-manager. eactl adds this to the base when a
# school's namespace says ea/access=public.
#
# The certificate is only issued if the address already leads to this server
# (its DNS record, and its line in the hairpin rules); see scripts/remote/README.md.

# Component: an optional extra for a Kustomization (see ../private).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: ingress-tls.yaml
