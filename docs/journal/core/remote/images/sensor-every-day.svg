<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img">
<title>A sensor every day after, and a lost one</title><desc>Each day the sensor joins its saved Wi-Fi, checks the server is really the school, and connects to the broker's sensors door with its ID and token. The broker checks the token and every message, so reps reach only the athlete's own set. A lost sensor is removed: its token is deleted and it is disconnected.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="580" fill="#FFFFFF"/>
<text x="120" y="36" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Sensor</text>
<text x="340" y="36" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Broker's sensors door</text>
<text x="560" y="36" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Athlete's rack</text>
<rect x="20" y="70" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="120" y="89" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Switched on</text>
<text x="120" y="109" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Joins its saved Wi-Fi</text>
<rect x="20" y="150" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="120" y="169" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Checks it's the school</text>
<text x="120" y="189" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Against its stored root</text>
<rect x="240" y="230" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340" y="249" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041">Checks ID and token</text>
<text x="340" y="269" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">Wrong token: refused</text>
<rect x="240" y="310" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340" y="329" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041">Checks every message</text>
<text x="340" y="349" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">Other topics: dropped</text>
<rect x="460" y="390" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="560" y="409" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Reps join their set</text>
<text x="560" y="429" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Once the athlete joins</text>
<rect x="240" y="470" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="340" y="489" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#712B13">Lost sensor removed</text>
<text x="340" y="509" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D">Token deleted, kicked off</text>
<path d="M120 126 L120 148" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M120 206 L120 258 L238 258" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M340 286 L340 308" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M340 366 L340 418 L458 418" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="546" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="62" y="553" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Checked with the token</text>
<rect x="250" y="546" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="272" y="553" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Removing a lost sensor</text>
<rect x="470" y="546" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="492" y="553" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Other steps</text>
</svg>
